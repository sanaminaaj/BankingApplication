spring.application.name=banking-parent

# =========================
# MySQL
# =========================
spring.datasource.url=jdbc:mysql://localhost:3306/banking_system
spring.datasource.username=root
spring.datasource.password=root

# =========================
# JPA
# =========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# =========================
# Kafka
# =========================
spring.kafka.bootstrap-servers=localhost:9092

# =========================
# Producer
# =========================
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# =========================
# Consumer
# =========================
spring.kafka.consumer.group-id=notification-service
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=com.fis.banking_parent.com.fis.banking_parent.events

spring.kafka.consumer.properties.spring.json.value.default.type=com.fis.banking_parent.com.fis.banking_parent.events.PaymentEvent